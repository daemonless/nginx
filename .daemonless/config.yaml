build:
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: pkg
      containerfile: Containerfile.pkg
      aliases: ["latest"]
      default: true
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15.1-latest"

cit:
  mode: health
  port: 80
  health: /daemonless-ping
  # nginx prints nothing at start; the health check decides.
  ready: "\\[init\\] Executing"
