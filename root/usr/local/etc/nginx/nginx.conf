# Master runs as root (port 80); workers drop to bsd. Started as another user
# (podman --user), nginx ignores this line and runs as that user.
user bsd;
worker_processes auto;
# Logs go to the container's output; podman, AppJail or Kubernetes keep them.
error_log stderr;
# /tmp is writable as any user, and as a tmpfs with a read-only root.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /dev/stdout main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Extra server configs: mount or COPY *.conf here.
    include /usr/local/etc/nginx/conf.d/*.conf;

    # Default server (can be overridden)
    server {
        listen 80 default_server;
        server_name _;

        root /usr/local/www/html;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }

        # Health check endpoint for container monitoring
        location /daemonless-ping {
            access_log off;
            return 200 "pong";
            add_header Content-Type text/plain;
        }
    }
}
